app-id: io.github.M5Devs.OpenROM
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: gui

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --filesystem=home
  - --device=dri

modules:
  - name: openrom
    buildsystem: simple

    build-commands:
      # Install the pre-built Flutter bundle.
      - mkdir -p /app
      - cp -r flatpak-build/bundle/. /app/

      # Make the GUI executable available as the Flatpak command.
      - mkdir -p /app/bin
      - ln -sf /app/gui /app/bin/gui

      # Install the Dart core backend.
      - install -Dm755 flatpak-build/openrom-core \
          /app/bin/openrom-core

      # Install conversion and patching tools.
      - install -Dm755 bins/linux/x86_64/chdman \
          /app/bin/chdman
      - install -Dm755 bins/linux/x86_64/ecm \
          /app/bin/ecm
      - install -Dm755 bins/linux/x86_64/unecm \
          /app/bin/unecm
      - install -Dm755 bins/linux/x86_64/maxcso \
          /app/bin/maxcso
      - install -Dm755 bins/linux/x86_64/extract-xiso \
          /app/bin/extract-xiso
      - install -Dm755 bins/linux/x86_64/nodtool \
          /app/bin/nodtool
      - install -Dm755 bins/linux/x86_64/xdelta3 \
          /app/bin/xdelta3
      - install -Dm755 bins/linux/x86_64/saturn-patcher \
          /app/bin/saturn-patcher

      # NKit requires additional files from its directory.
      - mkdir -p /app/lib/openrom/nkit
      - cp -a bins/linux/x86_64/nkit/. \
          /app/lib/openrom/nkit/
      - chmod 755 /app/lib/openrom/nkit/nkit
      - chmod 755 /app/lib/openrom/nkit/nkds
      - ln -sf /app/lib/openrom/nkit/nkit \
          /app/bin/nkit
      - ln -sf /app/lib/openrom/nkit/nkds \
          /app/bin/nkds

      # Install desktop integration files.
      - install -Dm644 flatpak/io.github.M5Devs.OpenROM.desktop \
          /app/share/applications/io.github.M5Devs.OpenROM.desktop

      - install -Dm644 assets/icons/icon.png \
          /app/share/icons/hicolor/256x256/apps/io.github.M5Devs.OpenROM.png

      - install -Dm644 flatpak/io.github.M5Devs.OpenROM.metainfo.xml \
          /app/share/metainfo/io.github.M5Devs.OpenROM.metainfo.xml

    sources:
      # The manifest is inside flatpak/, so .. is the repository root.
      - type: dir
        path: ..
