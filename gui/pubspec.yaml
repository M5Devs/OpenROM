name: gui
description: OpenROM — Universal ROM Compression Suite Desktop App
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.8
  http: ^1.2.0
  url_launcher: ^6.3.0
  intl: ^0.20.3
  path: ^1.9.0
  desktop_drop: ^0.4.0
  archive: ^3.6.1
  file_picker: 8.1.2
  window_manager: ^0.6.0
  shared_preferences: ^2.5.6
  path_provider: ^2.0.0
  openrom_core:
    path: ../core
    version: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  cross_file: ^0.3.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - themes/
    - assets/images/
    - assets/images/romeo/
