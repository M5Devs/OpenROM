name: openrom
description: OpenROM — Universal ROM Compression Suite Desktop App
publish_to: 'none'
version: 2.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  path: ^1.9.0
  desktop_drop: ^0.4.0
  file_picker: ^8.0.0
  window_manager: ^0.5.2
  shared_preferences: ^2.0.0
  path_provider: ^2.0.0
  openrom_core:
    path: ../core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  cross_file: ^0.3.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - themes/
