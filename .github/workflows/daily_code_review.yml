name: Daily Multi-Language Code Review

on:
  schedule:
    # Runs everyday at 06:00 UTC (8:00 AM Egypt Time)
    - cron: '0 6 * * *'
  # Allows manual triggers from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  daily-health-check:
    name: Codebase Static Analysis & Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 1. Setup Python Environment ──
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ── 2. Setup Flutter Environment ──
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── 3. Install Diagnostic & Quality Tools ──
      - name: Install Tooling Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y cppcheck
          pip install --upgrade pip
          pip install ruff bandit pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ── 4. Execute Multi-Language Review Engine ──
      - name: Run Full Diagnostic Pipeline
        id: diagnostics
        run: |
          mkdir -p .review_reports
          DATE_STR=$(date +'%Y-%m-%d')
          
          DART_ANALYZE_STATUS="🟢 PASSED"
          DART_FORMAT_STATUS="🟢 PASSED"
          DART_TESTS_STATUS="🟢 PASSED"
          PY_LINT_STATUS="🟢 PASSED"
          PY_SECURITY_STATUS="🟢 PASSED"
          PY_TESTS_STATUS="🟢 PASSED"
          CPP_STATUS="🟢 PASSED"

          # ──────── 1. Dart & Flutter (65%) ────────
          if [ -d "openrom_flutter" ]; then
            cd openrom_flutter
            flutter pub get > /dev/null 2>&1

            # Dart Format Check
            if ! dart format --output=none --set-exit-if-changed . > ../.review_reports/dart_format.raw.log 2>&1; then
              DART_FORMAT_STATUS="🟡 WARNING"
            fi

            # Flutter Analyze
            if ! flutter analyze > ../.review_reports/flutter_analyze.raw.log 2>&1; then
              DART_ANALYZE_STATUS="🔴 ISSUES DETECTED"
            fi

            # Flutter Tests
            if ! flutter test > ../.review_reports/flutter_test.raw.log 2>&1; then
              DART_TESTS_STATUS="🔴 FAILED"
            fi
            cd ..
          else
            echo "openrom_flutter directory not found." > .review_reports/flutter_analyze.raw.log
            DART_ANALYZE_STATUS="⚪ SKIPPED"
            DART_FORMAT_STATUS="⚪ SKIPPED"
            DART_TESTS_STATUS="⚪ SKIPPED"
          fi

          # ──────── 2. Python Core (25.2%) ────────
          if ! ruff check core/ > .review_reports/ruff.raw.log 2>&1; then
            PY_LINT_STATUS="🔴 ISSUES DETECTED"
          fi

          if ! bandit -r core/ -lll > .review_reports/bandit.raw.log 2>&1; then
            PY_SECURITY_STATUS="🚨 VULNERABILITY FOUND"
          fi

          if ! pytest tests/ -q > .review_reports/pytest.raw.log 2>&1; then
            PY_TESTS_STATUS="🔴 FAILED"
          fi

          # ──────── 3. Native C++ (4.1%) ────────
          if ! cppcheck --enable=warning,performance,portability --inline-suppr \
               --suppress=missingIncludeSystem openrom_flutter/windows/ openrom_flutter/linux/ \
               > .review_reports/cppcheck.raw.log 2>&1; then
            CPP_STATUS="🟡 WARNING"
          fi

          # ──────── Helper: Safe Log Truncation ────────
          truncate_log() {
            local file=$1
            if [ -f "$file" ]; then
              tail -n 60 "$file"
            else
              echo "No logs recorded."
            fi
          }

          # ──────── Construct Markdown Report Safely ────────
          cat << 'HEADER' > daily_summary.md
          ## 🩺 OpenROM Automated Daily Health Report
          HEADER

          echo "Audit date: **$DATE_STR** | Layers: **Flutter/Dart**, **Python Core**, and **Native C++**" >> daily_summary.md
          echo "" >> daily_summary.md
          echo "### 📌 Executive Health Summary" >> daily_summary.md
          echo "" >> daily_summary.md
          echo "| Component | Target | Status |" >> daily_summary.md
          echo "| :--- | :--- | :--- |" >> daily_summary.md
          echo "| **Flutter / Dart** (Analyze) | \`openrom_flutter/\` | $DART_ANALYZE_STATUS |" >> daily_summary.md
          echo "| **Flutter / Dart** (Format) | \`openrom_flutter/\` | $DART_FORMAT_STATUS |" >> daily_summary.md
          echo "| **Flutter / Dart** (Tests) | \`openrom_flutter/test/\` | $DART_TESTS_STATUS |" >> daily_summary.md
          echo "| **Python** (Ruff Lint) | \`core/\` | $PY_LINT_STATUS |" >> daily_summary.md
          echo "| **Python** (Bandit Sec) | \`core/\` | $PY_SECURITY_STATUS |" >> daily_summary.md
          echo "| **Python** (Pytest) | \`tests/\` | $PY_TESTS_STATUS |" >> daily_summary.md
          echo "| **C++ Native** (Cppcheck) | \`openrom_flutter/*/runner/\` | $CPP_STATUS |" >> daily_summary.md
          echo "" >> daily_summary.md
          echo "---" >> daily_summary.md
          echo "### 📑 Diagnostic Logs (Tail 60 Lines)" >> daily_summary.md

          append_section() {
            local title=$1
            local logfile=$2
            echo "<details>" >> daily_summary.md
            echo "<summary><b>$title</b></summary>" >> daily_summary.md
            echo "" >> daily_summary.md
            echo '```text' >> daily_summary.md
            truncate_log "$logfile" >> daily_summary.md
            echo '```' >> daily_summary.md
            echo "</details>" >> daily_summary.md
            echo "" >> daily_summary.md
          }

          append_section "1. Flutter Analyze Output" ".review_reports/flutter_analyze.raw.log"
          append_section "2. Dart Format Output" ".review_reports/dart_format.raw.log"
          append_section "3. Flutter Test Output" ".review_reports/flutter_test.raw.log"
          append_section "4. Python Ruff Linting" ".review_reports/ruff.raw.log"
          append_section "5. Python Bandit Audit" ".review_reports/bandit.raw.log"
          append_section "6. Python Pytest Output" ".review_reports/pytest.raw.log"
          append_section "7. C++ Cppcheck Output" ".review_reports/cppcheck.raw.log"

      # ── 5. Create Daily GitHub Issue with Character Limit Protection ──
      - name: Publish Health Report to GitHub Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const MAX_ALLOWED_CHARS = 60000; // Well below GitHub's 65,536 limit
            
            let reportBody = fs.readFileSync('daily_summary.md', 'utf8');
            if (reportBody.length > MAX_ALLOWED_CHARS) {
              reportBody = reportBody.substring(0, MAX_ALLOWED_CHARS) + 
                "\n\n---\n> ⚠️ **Note:** Some logs were truncated to fit GitHub Issue character limits.";
            }

            const today = new Date().toISOString().split('T')[0];
            const issueTitle = `[Daily Health Report] Automated Code Review - ${today}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: reportBody,
              labels: ['daily-review', 'automated', 'quality-assurance']
            });
