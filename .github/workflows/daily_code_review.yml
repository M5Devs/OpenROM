name: Daily Multi-Language Code Review

on:
  schedule:
    # Runs everyday at 06:00 UTC (8:00 AM Egypt Time)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  daily-health-check:
    name: Codebase Static Analysis & Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Flutter Environment ──
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── 3. Install Diagnostic & Quality Tools ──
      - name: Install Tooling Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y cppcheck

      # ── 4. Execute Multi-Language Review Engine ──
      - name: Run Full Diagnostic Pipeline
        id: diagnostics
        run: |
          mkdir -p .review_reports
          DATE_STR=$(date +'%Y-%m-%d')

          DART_ANALYZE_STATUS="🟢 PASSED"
          DART_FORMAT_STATUS="🟢 PASSED"
          DART_TESTS_STATUS="🟢 PASSED"
          DART_CORE_STATUS="🟢 PASSED"
          DART_CORE_TESTS_STATUS="🟢 PASSED"
          CPP_STATUS="🟢 PASSED"

          # ──────── 1. Dart & Flutter ────────
          if [ -d "gui" ]; then
            cd gui
            flutter pub get > /dev/null 2>&1

            # Dart Format Check
            if ! dart format --output=none --set-exit-if-changed . \
                 > ../.review_reports/dart_format.raw.log 2>&1; then
              DART_FORMAT_STATUS="🟡 WARNING"
            fi

            # Flutter Analyze
            if ! flutter analyze \
                 > ../.review_reports/flutter_analyze.raw.log 2>&1; then
              DART_ANALYZE_STATUS="🔴 ISSUES DETECTED"
            fi

            # Flutter Tests
            if ! flutter test \
                 > ../.review_reports/flutter_test.raw.log 2>&1; then
              DART_TESTS_STATUS="🔴 FAILED"
            fi
            cd ..
          else
            echo "gui directory not found." \
                 > .review_reports/flutter_analyze.raw.log
            DART_ANALYZE_STATUS="⚪ SKIPPED"
            DART_FORMAT_STATUS="⚪ SKIPPED"
            DART_TESTS_STATUS="⚪ SKIPPED"
          fi

          # ──────── 2. Dart Core ────────
          if [ -d "core" ]; then
            cd core
            dart pub get > /dev/null 2>&1

            if ! dart analyze \
                 > ../.review_reports/dart_core_analyze.raw.log 2>&1; then
              DART_CORE_STATUS="🔴 ISSUES DETECTED"
            fi

            if ! dart test \
                 > ../.review_reports/dart_core_test.raw.log 2>&1; then
              DART_CORE_TESTS_STATUS="🔴 FAILED"
            fi
            cd ..
          fi

          # ──────── 3. Native C++ ────────
          # cppcheck always exits 0 — check output for real errors/warnings
          cppcheck --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            gui/windows/ gui/linux/ \
            > .review_reports/cppcheck.raw.log 2>&1 || true

          if grep -q "error:" .review_reports/cppcheck.raw.log; then
            CPP_STATUS="🔴 ERRORS FOUND"
          elif grep -q "warning:" .review_reports/cppcheck.raw.log; then
            CPP_STATUS="🟡 WARNINGS"
          fi

          # ──────── Helper: Safe Log Truncation ────────
          truncate_log() {
            local file=$1
            if [ -f "$file" ]; then
              tail -n 60 "$file"
            else
              echo "No logs recorded."
            fi
          }

          # ──────── Construct Markdown Report ────────
          cat << 'HEADER' > daily_summary.md
          ## 🩺 OpenROM Automated Daily Health Report
          HEADER

          echo "Audit date: **$DATE_STR** | Layers: **Flutter/Dart GUI**, **Dart Core**, and **Native C++**" >> daily_summary.md
          echo "" >> daily_summary.md
          echo "### 📌 Executive Health Summary" >> daily_summary.md
          echo "" >> daily_summary.md
          echo "| Component | Target | Status |" >> daily_summary.md
          echo "| :--- | :--- | :--- |" >> daily_summary.md
          echo "| **Flutter / Dart** (Analyze) | \`gui/\` | $DART_ANALYZE_STATUS |" >> daily_summary.md
          echo "| **Flutter / Dart** (Format)  | \`gui/\` | $DART_FORMAT_STATUS |" >> daily_summary.md
          echo "| **Flutter / Dart** (Tests)   | \`gui/test/\` | $DART_TESTS_STATUS |" >> daily_summary.md
          echo "| **Dart Core** (Analyze)       | \`core/\` | $DART_CORE_STATUS |" >> daily_summary.md
          echo "| **Dart Core** (Tests)         | \`core/test/\` | $DART_CORE_TESTS_STATUS |" >> daily_summary.md
          echo "| **C++ Native** (Cppcheck)     | \`gui/*/runner/\` | $CPP_STATUS |" >> daily_summary.md
          echo "" >> daily_summary.md
          echo "---" >> daily_summary.md
          echo "### 📑 Diagnostic Logs (Tail 60 Lines)" >> daily_summary.md

          append_section() {
            local title=$1
            local logfile=$2
            echo "<details>" >> daily_summary.md
            echo "<summary><b>$title</b></summary>" >> daily_summary.md
            echo "" >> daily_summary.md
            echo '```text' >> daily_summary.md
            truncate_log "$logfile" >> daily_summary.md
            echo '```' >> daily_summary.md
            echo "</details>" >> daily_summary.md
            echo "" >> daily_summary.md
          }

          append_section "1. Flutter Analyze Output"  ".review_reports/flutter_analyze.raw.log"
          append_section "2. Dart Format Output"      ".review_reports/dart_format.raw.log"
          append_section "3. Flutter Test Output"     ".review_reports/flutter_test.raw.log"
          append_section "4. Dart Core Analyze"       ".review_reports/dart_core_analyze.raw.log"
          append_section "5. Dart Core Tests"         ".review_reports/dart_core_test.raw.log"
          append_section "6. C++ Cppcheck Output"     ".review_reports/cppcheck.raw.log"

      # ── 5. Publish Health Report — close old issues first ──
      - name: Publish Health Report to GitHub Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const MAX_ALLOWED_CHARS = 60000;

            // ── Close all previous open daily-review issues ──
            const oldIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'daily-review',
              state: 'open',
              per_page: 50,
            });

            for (const issue of oldIssues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

            // ── Build report body ──
            let reportBody = fs.readFileSync('daily_summary.md', 'utf8');
            if (reportBody.length > MAX_ALLOWED_CHARS) {
              reportBody = reportBody.substring(0, MAX_ALLOWED_CHARS) +
                '\n\n---\n> ⚠️ **Note:** Some logs were truncated to fit GitHub Issue character limits.';
            }

            const today = new Date().toISOString().split('T')[0];
            const issueTitle = `[Daily Health Report] Automated Code Review - ${today}`;

            // ── Open fresh issue for today ──
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: reportBody,
              labels: ['daily-review', 'automated', 'quality-assurance'],
            });
