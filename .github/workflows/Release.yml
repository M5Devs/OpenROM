name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 2.2.0)'
        required: true
        default: '2.2.0'

permissions:
  contents: write

jobs:

  # ── Windows — Flutter GUI + Nuitka CLI ──────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # ── Visual Studio Build Tools (required by Flutter + Nuitka) ──
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Flutter Windows dependencies (VC++ workload)
        run: |
          choco install visualstudio2022buildtools `
            --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended" `
            -y --no-progress

      # ── Python / Nuitka → openrom-core.exe ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Build openrom-core.exe (Nuitka — lower AV false positives)
        run: |
          python -m nuitka `
            --onefile `
            --assume-yes-for-downloads `
            --output-filename=openrom-core.exe `
            --include-data-dir=assets=assets `
            --windows-console-mode=force `
            core/cli.py

      # ── Flutter → OpenROM.exe ──
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Flutter dependencies
        working-directory: openrom_flutter
        run: flutter pub get

      - name: Build Flutter Windows
        working-directory: openrom_flutter
        run: flutter build windows --release

      # ── Package ZIP ──
      - name: Package ZIP
        run: |
          $out = "openrom_flutter/build/windows/x64/runner/Release"
          cp openrom-core.exe "$out/"
          cp -r themes/ "$out/themes/"
          $version = "${{ github.event.inputs.version }}"
          $readme = "OpenROM v$version - Windows`n======================================================`nRUN THIS: openrom_flutter.exe   <-- this is the app!`n`nopenrom-core.exe is the backend engine, do NOT run it directly.`n`nDocs: https://github.com/M5Devs/OpenROM"
          Set-Content -Path "$out/README.txt" -Value $readme
          Compress-Archive -Path "$out/*" -DestinationPath OpenROM-v${{ github.event.inputs.version }}_Windows_Portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenROM_Windows
          path: OpenROM-v${{ github.event.inputs.version }}_Windows_Portable.zip

  # ── Linux — Flutter AppImage + Nuitka CLI ───────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # ── System deps ──
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/microsoft-*.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/github-cli.list
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            libfuse2 wget fuse \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libgdk-pixbuf2.0-dev \
            patchelf ccache

      # ── Python / Nuitka → openrom-core ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Build openrom-core (Nuitka — lower AV false positives)
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-filename=openrom-core \
            --include-data-dir=assets=assets \
            core/cli.py
          chmod +x openrom-core

      # ── Flutter → OpenROM binary ──
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Flutter dependencies
        working-directory: openrom_flutter
        run: flutter pub get

      - name: Build Flutter Linux
        working-directory: openrom_flutter
        run: flutter build linux --release

      # ── AppImage ──
      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r openrom_flutter/build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp openrom-core AppDir/usr/bin/
          chmod +x AppDir/usr/bin/openrom-core
          cp -r themes/ AppDir/usr/bin/themes/
          cp assets/icons/icon.png AppDir/openrom.png
          cp assets/icons/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/openrom.png

          cat > AppDir/OpenROM.desktop << EOF
          [Desktop Entry]
          Name=OpenROM
          Exec=openrom_flutter
          Icon=openrom
          Type=Application
          Categories=Utility;
          Comment=Universal ROM Compression Suite
          EOF

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/openrom_flutter" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool AppDir OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.AppImage
          chmod +x OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.AppImage

      - name: Package ZIP
        run: |
          mkdir release
          cp OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.AppImage release/
          cp openrom-core release/
          chmod +x release/openrom-core
          printf 'OpenROM - Linux\n======================================================\nRUN THIS: ./OpenROM-*.AppImage   <-- this is the app!\n\nopenrom-core is the backend engine, do NOT run it directly.\n\nDocs: https://github.com/M5Devs/OpenROM\n' > release/README.txt
          cd release
          zip -r ../OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenROM_Linux
          path: OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.zip

  # ── macOS — Flutter .app DMG + Nuitka CLI ───────────────────────────────────
  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ── Python / Nuitka → openrom-core ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Build openrom-core (Nuitka — lower AV false positives)
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-filename=openrom-core \
            --include-data-dir=assets=assets \
            --macos-target-arch=${{ matrix.arch }} \
            core/cli.py
          chmod +x openrom-core

      # ── Flutter → OpenROM.app ──
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Flutter dependencies
        working-directory: openrom_flutter
        run: flutter pub get

      - name: Build Flutter macOS
        working-directory: openrom_flutter
        run: flutter build macos --release

      # ── Embed openrom-core inside .app bundle ──
      - name: Embed openrom-core in .app bundle
        run: |
          APP_MACOS="openrom_flutter/build/macos/Build/Products/Release/openrom_flutter.app/Contents/MacOS"
          cp openrom-core "$APP_MACOS/openrom-core"
          chmod +x "$APP_MACOS/openrom-core"
          cp -r themes/ "$APP_MACOS/themes/"

      # ── DMG ──
      - name: Create DMG
        run: |
          mkdir -p dmg_contents
          cp -r "openrom_flutter/build/macos/Build/Products/Release/openrom_flutter.app" \
                dmg_contents/OpenROM.app
          hdiutil create \
            -volname "OpenROM" \
            -srcfolder dmg_contents \
            -ov \
            -format UDZO \
            OpenROM-v${{ github.event.inputs.version }}_macOS_${{ matrix.arch }}.dmg

      - name: Package ZIP
        run: |
          mkdir release
          cp OpenROM-v${{ github.event.inputs.version }}_macOS_${{ matrix.arch }}.dmg release/
          cp openrom-core release/
          chmod +x release/openrom-core
          printf 'OpenROM - macOS\n======================================================\nRUN THIS: Open the .dmg and drag OpenROM to Applications.\n\nopenrom-core is the backend engine, do NOT run it directly.\n\nDocs: https://github.com/M5Devs/OpenROM\n' > release/README.txt
          cd release
          zip -r ../OpenROM-v${{ github.event.inputs.version }}_macOS_${{ matrix.arch }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenROM_macOS_${{ matrix.arch }}
          path: OpenROM-v${{ github.event.inputs.version }}_macOS_${{ matrix.arch }}.zip

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: OpenROM v${{ github.event.inputs.version }}
          body: |
            ## OpenROM v${{ github.event.inputs.version }}

            Universal ROM Conversion Suite for retro gaming.

            Each download includes:
            - **OpenROM** — Flutter desktop GUI
            - **openrom-core** — headless CLI (used internally by the GUI)

            ### CLI usage
            ```
            openrom-core --detect game.iso
            openrom-core --input game.iso --format CHD
            openrom-core --folder /roms/ --format CHD --compression Max
            openrom-core --list-formats
            ```

            ### Supported Formats
            - PS1: BIN/CUE → CHD, ECM
            - PS2: ISO → CHD, CSO
            - GameCube/Wii: ISO → RVZ
            - Xbox: ISO → XISO
            - PSP: ISO → CSO

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows | `OpenROM-v${{ github.event.inputs.version }}_Windows_Portable.zip` |
            | Linux | `OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.zip` |
            | macOS Apple Silicon | `OpenROM-v${{ github.event.inputs.version }}_macOS_arm64.zip` |
            | macOS Intel | `OpenROM-v${{ github.event.inputs.version }}_macOS_x86_64.zip` |

          files: |
            artifacts/OpenROM_Windows/OpenROM-v${{ github.event.inputs.version }}_Windows_Portable.zip
            artifacts/OpenROM_Linux/OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.zip
            artifacts/OpenROM_macOS_arm64/OpenROM-v${{ github.event.inputs.version }}_macOS_arm64.zip
            artifacts/OpenROM_macOS_x86_64/OpenROM-v${{ github.event.inputs.version }}_macOS_x86_64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
