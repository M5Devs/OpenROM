name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 3.5.0)'
        required: true
        default: '3.5.0'
      bins_ref:
        description: 'OpenROM-bins ref used for the default checksums URL'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:

  # ── Windows — Flutter GUI + Dart CLI ────────────────────
  build-windows:
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      OPENROM_BINS_REF: ${{ github.event.inputs.bins_ref }}
    steps:
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "Error: invalid version '$RELEASE_VERSION' (expected e.g. 3.5.0)" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Fetch binaries from SourceForge
        shell: bash
        run: |
          bash scripts/fetch-binaries.sh --os windows --arch x86_64 --dest assets/windows

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Install Flutter Windows dependencies (VC++ workload)
        run: |
          choco install visualstudio2022buildtools `
            --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended" `
            -y --no-progress

      - name: Set version
        run: echo "$env:RELEASE_VERSION" | Out-File -FilePath VERSION -Encoding utf8 -NoNewline

      - name: Patch pubspec version
        run: |
          $version = "$env:RELEASE_VERSION"
          (Get-Content gui/pubspec.yaml) `
            -replace '^version: .*', "version: $version+1" |
            Set-Content gui/pubspec.yaml

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build openrom-core (Dart)
        run: |
          cd core
          dart pub get
          New-Item -ItemType Directory -Force -Path ..\dist
          dart compile exe bin/openrom.dart -o ../dist/openrom-core.exe

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter dependencies
        working-directory: gui
        run: flutter pub get

      - name: Build Flutter Windows
        working-directory: gui
        run: flutter build windows --release

      - name: Prepare release files
        run: |
          $releaseDir = "gui/build/windows/x64/runner/Release"

          Copy-Item -Force "dist\openrom-core.exe" "$releaseDir\"
          Copy-Item -Force "VERSION" "$releaseDir\"
          Copy-Item -Recurse -Force "themes/" "$releaseDir/themes/"
          Copy-Item -Recurse -Force "assets/" "$releaseDir/assets/"

          $version = "$env:RELEASE_VERSION"
          $readme = "OpenROM v$version - Windows`n======================================================`nRUN THIS: gui.exe`n`nopenrom-core.exe is the backend engine, do NOT run it directly.`n`nDocs: https://github.com/M5Devs/OpenROM"
          Set-Content -Path "$releaseDir/README.txt" -Value $readme

          New-Item -ItemType Directory -Path dist\release -Force
          Copy-Item -Recurse "$releaseDir/*" dist\release/

          Write-Host "dist\release contents:"
          Get-ChildItem dist\release\ | Select-Object Name

      - name: Package ZIP
        run: |
          $releaseDir = "gui/build/windows/x64/runner/Release"
          Compress-Archive -Path "$releaseDir/*" `
            -DestinationPath OpenROM-v${env:RELEASE_VERSION}_Windows_Portable.zip

      - name: Install NSIS and dependencies
        run: |
          choco install nsis -y --no-progress
          choco install imagemagick -y --no-progress

      - name: Download NSIS EnVar plugin
        run: |
          $url = "https://nsis.sourceforge.io/mediawiki/images/7/7f/EnVar_plugin.zip"
          Invoke-WebRequest -Uri $url -OutFile EnVar.zip
          Expand-Archive -Path EnVar.zip -DestinationPath EnVar
          Copy-Item -Path "EnVar\Plugins\x86-unicode\EnVar.dll" `
            -Destination "C:\Program Files (x86)\NSIS\Plugins\x86-unicode\"

      - name: Convert SECURITY.md to txt
        run: Get-Content SECURITY.md | Out-File -FilePath SECURITY.txt -Encoding utf8

      - name: Generate installer images
        run: |
          magick assets/icons/icon.png `
            -resize 164x314 -background "#090910" -gravity center `
            -extent 164x314 -type TrueColor -depth 24 `
            BMP3:assets/icons/installer-sidebar.bmp
          magick assets/icons/OpenROM-Banner.jpeg `
            -resize 150x57 -type TrueColor -depth 24 `
            BMP3:assets/icons/installer-header.bmp
          magick assets/icons/icon.png `
            -define icon:auto-resize=256,128,64,48,32,16 `
            assets/icons/icon.ico

      - name: Build Windows installer
        run: |
          $version = "$env:RELEASE_VERSION"
          makensis /DAPP_VERSION=$version openrom.nsi

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenROM_Windows
          path: OpenROM-v${{ github.event.inputs.version }}_Windows_Portable.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenROM_Windows_Installer
          path: OpenROM-v${{ github.event.inputs.version }}-Setup.exe

  # ── Linux — Flutter AppImage + Dart CLI ─────────────────
  build-linux:
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      OPENROM_BINS_REF: ${{ github.event.inputs.bins_ref }}
    steps:
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "Error: invalid version '$RELEASE_VERSION' (expected e.g. 3.5.0)" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Fetch binaries from SourceForge
        run: |
          bash scripts/fetch-binaries.sh --os linux --arch x86_64 --dest assets/linux/x86_64

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/microsoft-*.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/github-cli.list
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            libfuse2 wget fuse zip file \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libgdk-pixbuf2.0-dev \
            patchelf ccache

      - name: Set version
        run: echo "$RELEASE_VERSION" > VERSION

      - name: Patch pubspec version
        run: |
          VERSION="$RELEASE_VERSION"
          sed -i "s/^version: .*/version: ${VERSION}+1/" gui/pubspec.yaml

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build openrom-core (Dart)
        run: |
          cd core
          dart pub get
          mkdir -p ../dist
          dart compile exe bin/openrom.dart -o ../dist/openrom-core
          chmod +x ../dist/openrom-core

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter dependencies
        working-directory: gui
        run: flutter pub get

      - name: Build Flutter Linux
        working-directory: gui
        run: flutter build linux --release

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool
          chmod +x appimagetool

      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r gui/build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp dist/openrom-core AppDir/usr/bin/openrom-core
          chmod +x AppDir/usr/bin/openrom-core
          cp VERSION AppDir/usr/bin/VERSION
          cp -r themes/ AppDir/usr/bin/themes/
          cp -r assets/ AppDir/usr/bin/assets/
          cp assets/icons/icon.png AppDir/openrom.png
          cp assets/icons/icon.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/openrom.png

          cat > AppDir/OpenROM.desktop << EOF
          [Desktop Entry]
          Name=OpenROM
          Exec=gui
          Icon=openrom
          Type=Application
          Categories=Utility;
          Comment=Universal Retro Gaming Toolkit
          EOF

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/gui" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          ARCH=x86_64 ./appimagetool AppDir \
            "OpenROM-v${RELEASE_VERSION}_Linux_x86_64.AppImage"
          chmod +x "OpenROM-v${RELEASE_VERSION}_Linux_x86_64.AppImage"

      - name: Package Core CLI ZIP
        run: |
          set -e
          VERSION="$RELEASE_VERSION"
          CORE="release-core"
          rm -rf "$CORE"
          mkdir -p "$CORE/assets/linux/x86_64"

          cp dist/openrom-core "$CORE/openrom-core"
          chmod +x "$CORE/openrom-core"
          cp VERSION "$CORE/VERSION"

          for tool in xdelta3 ecm unecm saturn-patcher; do
            if [ -f "assets/linux/x86_64/$tool" ]; then
              cp "assets/linux/x86_64/$tool" "$CORE/assets/linux/x86_64/$tool"
              chmod +x "$CORE/assets/linux/x86_64/$tool"
            fi
          done

          printf 'OpenROM Core CLI - Linux x86_64\n======================================================\nRUN THIS: ./openrom-core --help\n\nopenrom-core is the headless CLI engine. The Flutter GUI ships\nseparately as OpenROM-v%s_Linux_x86_64.AppImage.\n\nBundled light tools: xdelta3, ecm, unecm, saturn-patcher.\nFor CHD/CSO/RVZ/XISO conversions use the AppImage build.\n\nDocs: https://github.com/M5Devs/OpenROM\n' \
            "$VERSION" > "$CORE/README.txt"

          ( cd "$CORE" && zip -r "../OpenROM-Core-v${VERSION}_Linux_x86_64.zip" . )

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenROM_Linux
          path: |
            OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.AppImage
            OpenROM-Core-v${{ github.event.inputs.version }}_Linux_x86_64.zip

  # ── Linux ARM64 ──────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      OPENROM_BINS_REF: ${{ github.event.inputs.bins_ref }}
    steps:
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "Error: invalid version '$RELEASE_VERSION' (expected e.g. 3.5.0)" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Fetch binaries from SourceForge
        run: |
          bash scripts/fetch-binaries.sh --os linux --arch arm64 --dest assets/linux/arm64

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            wget zip file \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libgdk-pixbuf2.0-dev \
            gcc make git \
            patchelf ccache

      - name: Set version
        run: echo "$RELEASE_VERSION" > VERSION

      - name: Patch pubspec version
        run: |
          VERSION="$RELEASE_VERSION"
          sed -i "s/^version: .*/version: ${VERSION}+1/" gui/pubspec.yaml

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build openrom-core (Dart)
        run: |
          cd core
          dart pub get
          mkdir -p ../dist
          dart compile exe bin/openrom.dart -o ../dist/openrom-core
          chmod +x ../dist/openrom-core

      - name: Set up Flutter (manual install for ARM64)
        run: |
          git clone https://github.com/flutter/flutter.git \
            --depth 1 --branch stable \
            $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Flutter precache Linux
        run: flutter precache --linux

      - name: Flutter dependencies
        working-directory: gui
        run: flutter pub get

      - name: Build Flutter Linux ARM64
        working-directory: gui
        run: flutter build linux --release

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage \
            -O appimagetool
          chmod +x appimagetool

      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r gui/build/linux/arm64/release/bundle/. AppDir/usr/bin/
          cp dist/openrom-core AppDir/usr/bin/openrom-core
          chmod +x AppDir/usr/bin/openrom-core
          cp VERSION AppDir/usr/bin/VERSION
          cp -r themes/ AppDir/usr/bin/themes/
          cp -r assets/ AppDir/usr/bin/assets/
          cp assets/icons/icon.png AppDir/openrom.png
          cp assets/icons/icon.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/openrom.png

          cat > AppDir/OpenROM.desktop << EOF
          [Desktop Entry]
          Name=OpenROM
          Exec=gui
          Icon=openrom
          Type=Application
          Categories=Utility;
          Comment=Universal Retro Gaming Toolkit
          EOF

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/gui" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          ARCH=aarch64 ./appimagetool AppDir \
            "OpenROM-v${RELEASE_VERSION}_Linux_arm64.AppImage"
          chmod +x "OpenROM-v${RELEASE_VERSION}_Linux_arm64.AppImage"

      - name: Package Core CLI ZIP
        run: |
          set -e
          VERSION="$RELEASE_VERSION"
          CORE="release-core"
          rm -rf "$CORE"
          mkdir -p "$CORE/assets/linux/arm64"

          cp dist/openrom-core "$CORE/openrom-core"
          chmod +x "$CORE/openrom-core"
          cp VERSION "$CORE/VERSION"

          for tool in xdelta3 ecm unecm saturn-patcher; do
            if [ -f "assets/linux/arm64/$tool" ]; then
              cp "assets/linux/arm64/$tool" "$CORE/assets/linux/arm64/$tool"
              chmod +x "$CORE/assets/linux/arm64/$tool"
            fi
          done

          printf 'OpenROM Core CLI - Linux ARM64\n======================================================\nRUN THIS: ./openrom-core --help\n\nopenrom-core is the headless CLI engine. The Flutter GUI ships\nseparately as OpenROM-v%s_Linux_arm64.AppImage.\n\nBundled light tools: xdelta3, ecm, unecm, saturn-patcher.\nFor CHD/CSO/RVZ/XISO conversions use the AppImage build.\n\nDocs: https://github.com/M5Devs/OpenROM\n' \
            "$VERSION" > "$CORE/README.txt"

          ( cd "$CORE" && zip -r "../OpenROM-Core-v${VERSION}_Linux_arm64.zip" . )

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenROM_Linux_arm64
          path: |
            OpenROM-v${{ github.event.inputs.version }}_Linux_arm64.AppImage
            OpenROM-Core-v${{ github.event.inputs.version }}_Linux_arm64.zip

  # ── macOS ────────────────────────────────────────────────
  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      OPENROM_BINS_REF: ${{ github.event.inputs.bins_ref }}
      MATRIX_ARCH: ${{ matrix.arch }}
    steps:
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "Error: invalid version '$RELEASE_VERSION' (expected e.g. 3.5.0)" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Fetch binaries from SourceForge
        run: |
          bash scripts/fetch-binaries.sh --os macos --arch "$MATRIX_ARCH" --dest "assets/macos/$MATRIX_ARCH"

      - name: Set version
        run: echo "$RELEASE_VERSION" > VERSION

      - name: Patch pubspec version
        run: |
          VERSION="$RELEASE_VERSION"
          sed -i "" "s/^version: .*/version: ${VERSION}+1/" gui/pubspec.yaml

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build openrom-core (Dart)
        run: |
          cd core
          dart pub get
          mkdir -p ../dist
          dart compile exe bin/openrom.dart -o ../dist/openrom-core
          chmod +x ../dist/openrom-core

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter dependencies
        working-directory: gui
        run: flutter pub get

      - name: Build Flutter macOS
        working-directory: gui
        run: flutter build macos --release

      - name: Embed openrom-core in .app bundle
        run: |
          APP=$(find gui/build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          APP_MACOS="$APP/Contents/MacOS"
          echo "Found .app at: $APP"
          echo "MacOS dir: $APP_MACOS"
          ls -la dist/
          cp dist/openrom-core "$APP_MACOS/openrom-core"
          chmod +x "$APP_MACOS/openrom-core"
          cp VERSION "$APP_MACOS/VERSION"
          cp -r themes/ "$APP_MACOS/themes/"
          cp -r assets/ "$APP_MACOS/assets/"

      - name: Sign app bundle (ad-hoc)
        run: |
          APP=$(find gui/build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          echo "Signing: $APP"
          xattr -cr "$APP"
          codesign --deep --force \
            --entitlements macos_entitlements.plist \
            --sign - \
            "$APP"

      - name: Create DMG
        run: |
          APP=$(find gui/build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          echo "Packaging: $APP"
          mkdir -p dmg_contents
          cp -r "$APP" dmg_contents/OpenROM.app
          hdiutil create \
            -volname "OpenROM" \
            -srcfolder dmg_contents \
            -ov \
            -format UDZO \
            "OpenROM-v${RELEASE_VERSION}_macOS_$MATRIX_ARCH.dmg"

      - name: Package ZIP
        run: |
          mkdir release
          cp "OpenROM-v${RELEASE_VERSION}_macOS_$MATRIX_ARCH.dmg" release/
          printf 'OpenROM - macOS\n======================================================\nRUN THIS: Open the .dmg and drag OpenROM to Applications.\n\nDocs: https://github.com/M5Devs/OpenROM\n' \
            > release/README.txt
          cd release
          zip -r "../OpenROM-v${RELEASE_VERSION}_macOS_$MATRIX_ARCH.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenROM_macOS_${{ matrix.arch }}
          path: OpenROM-v${{ github.event.inputs.version }}_macOS_${{ matrix.arch }}.zip

  # ── GitHub Release ───────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: OpenROM v${{ github.event.inputs.version }}
          body: |
            ## OpenROM v${{ github.event.inputs.version }}

            Universal Retro Gaming Toolkit for retro gaming enthusiasts.

            Each download includes:
            - **OpenROM** — Flutter desktop GUI
            - **openrom-core** — headless CLI (used internally by the GUI)

            ### CLI usage
            ```
            openrom-core --detect game.iso
            openrom-core --input game.iso --format CHD
            openrom-core --folder /roms/ --format CHD --compression Max
            openrom-core --list-formats
            ```

            ### Supported Formats
            - PS1/Dreamcast/Saturn/Sega CD: BIN/CUE → CHD (createcd)
            - PS2/GameCube/Wii/Xbox: ISO → CHD (createdvd), CSO, RVZ, XISO
            - PSP: ISO → CSO
            - Universal: ZIP/7Z compression, IPS/BPS/xdelta3/DCP patching

            ### Downloads
            | Platform | File |
            |----------|------|
            | 🪟 Windows (Portable) | `OpenROM-v${{ github.event.inputs.version }}_Windows_Portable.zip` |
            | 🪟 Windows (Installer) | `OpenROM-v${{ github.event.inputs.version }}-Setup.exe` |
            | 🐧 Linux x86_64 (AppImage) | `OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.AppImage` |
            | 🐧 Linux ARM64 (AppImage) | `OpenROM-v${{ github.event.inputs.version }}_Linux_arm64.AppImage` |
            | 🐧 Linux x86_64 (Core CLI) | `OpenROM-Core-v${{ github.event.inputs.version }}_Linux_x86_64.zip` |
            | 🐧 Linux ARM64 (Core CLI) | `OpenROM-Core-v${{ github.event.inputs.version }}_Linux_arm64.zip` |
            | 🍎 macOS Apple Silicon | `OpenROM-v${{ github.event.inputs.version }}_macOS_arm64.zip` |
            | 🍎 macOS Intel | `OpenROM-v${{ github.event.inputs.version }}_macOS_x86_64.zip` |

            ### Linux notes
            - **AppImage** — full GUI with the bundled `openrom-core` engine and all tools. Run it directly, no unzip needed.
            - **Core CLI ZIP** — standalone `openrom-core` binary with light tools (xdelta3, ecm, unecm, saturn-patcher) for scripting and automation.

          files: |
            artifacts/OpenROM_Windows/OpenROM-v${{ github.event.inputs.version }}_Windows_Portable.zip
            artifacts/OpenROM_Windows_Installer/OpenROM-v${{ github.event.inputs.version }}-Setup.exe
            artifacts/OpenROM_Linux/OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.AppImage
            artifacts/OpenROM_Linux/OpenROM-Core-v${{ github.event.inputs.version }}_Linux_x86_64.zip
            artifacts/OpenROM_Linux_arm64/OpenROM-v${{ github.event.inputs.version }}_Linux_arm64.AppImage
            artifacts/OpenROM_Linux_arm64/OpenROM-Core-v${{ github.event.inputs.version }}_Linux_arm64.zip
            artifacts/OpenROM_macOS_arm64/OpenROM-v${{ github.event.inputs.version }}_macOS_arm64.zip
            artifacts/OpenROM_macOS_x86_64/OpenROM-v${{ github.event.inputs.version }}_macOS_x86_64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
