name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 3.0.1)'
        required: true
        default: '3.0.1'

permissions:
  contents: write

jobs:

  # ── Windows — Flutter GUI + Nuitka CLI ──────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch binaries from OpenROM-bins
        run: |
          git clone --depth 1 https://github.com/M5Devs/OpenROM-bins.git bins
          New-Item -ItemType Directory -Force -Path assets\windows
          Copy-Item -Path "bins\windows\x86_64\*" -Destination "assets\windows\" -Recurse

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Flutter Windows dependencies (VC++ workload)
        run: |
          choco install visualstudio2022buildtools `
            --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended" `
            -y --no-progress

      - name: Set version
        run: echo "${{ github.event.inputs.version }}" | Out-File -FilePath VERSION -Encoding utf8 -NoNewline

      - name: Patch pubspec version
        run: |
          $version = "${{ github.event.inputs.version }}"
          (Get-Content gui/pubspec.yaml) `
            -replace '^version: .*', "version: $version+1" |
            Set-Content gui/pubspec.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      # ── Nuitka standalone — avoids AV false positives from --onefile ──
      # --onefile uses a self-extracting stub identical to malware droppers,
      # triggering trojan.badjoke/Wacapew/Stealer flags on 10+ AV engines.
      # --standalone produces a folder distribution: no extraction, no flags.
      - name: Build openrom-core (Nuitka standalone)
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --output-filename=openrom-core `
            --output-dir=dist `
            --include-data-dir=assets=assets `
            --windows-icon-from-ico=assets/icons/icon.ico `
            --windows-console-mode=force `
            core/cli.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter dependencies
        working-directory: gui
        run: flutter pub get

      - name: Build Flutter Windows
        working-directory: gui
        run: flutter build windows --release

      - name: Prepare release files
        run: |
          $releaseDir = "gui/build/windows/x64/runner/Release"

          # Copy openrom-core standalone folder contents (exe + DLLs)
          Copy-Item -Recurse -Force "dist\openrom-core.dist\*" "$releaseDir\"

          Copy-Item -Recurse -Force "themes/" "$releaseDir/themes/"

          $version = "${{ github.event.inputs.version }}"
          $readme = "OpenROM v$version - Windows`n======================================================`nRUN THIS: gui.exe`n`nopenrom-core.exe is the backend engine, do NOT run it directly.`n`nDocs: https://github.com/M5Devs/OpenROM"
          Set-Content -Path "$releaseDir/README.txt" -Value $readme

          New-Item -ItemType Directory -Path dist\release -Force
          Copy-Item -Recurse "$releaseDir/*" dist\release/

          Write-Host "dist\release contents:"
          Get-ChildItem dist\release\ | Select-Object Name

      - name: Package ZIP
        run: |
          $releaseDir = "gui/build/windows/x64/runner/Release"
          Compress-Archive -Path "$releaseDir/*" `
            -DestinationPath OpenROM-v${{ github.event.inputs.version }}_Windows_Portable.zip

      - name: Install NSIS and dependencies
        run: |
          choco install nsis -y --no-progress
          choco install imagemagick -y --no-progress

      - name: Download NSIS EnVar plugin
        run: |
          $url = "https://nsis.sourceforge.io/mediawiki/images/7/7f/EnVar_plugin.zip"
          Invoke-WebRequest -Uri $url -OutFile EnVar.zip
          Expand-Archive -Path EnVar.zip -DestinationPath EnVar
          Copy-Item -Path "EnVar\Plugins\x86-unicode\EnVar.dll" `
            -Destination "C:\Program Files (x86)\NSIS\Plugins\x86-unicode\"

      - name: Convert SECURITY.md to txt
        run: Get-Content SECURITY.md | Out-File -FilePath SECURITY.txt -Encoding utf8

      - name: Generate installer images
        run: |
          magick assets/icons/icon.png `
            -resize 164x314 -background "#090910" -gravity center `
            -extent 164x314 -type TrueColor -depth 24 `
            BMP3:assets/icons/installer-sidebar.bmp
          magick assets/icons/OpenROM-Banner.jpeg `
            -resize 150x57 -type TrueColor -depth 24 `
            BMP3:assets/icons/installer-header.bmp
          magick assets/icons/icon.png `
            -define icon:auto-resize=256,128,64,48,32,16 `
            assets/icons/icon.ico

      - name: Build Windows installer
        run: |
          $version = "${{ github.event.inputs.version }}"
          makensis /DAPP_VERSION=$version openrom.nsi

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenROM_Windows
          path: OpenROM-v${{ github.event.inputs.version }}_Windows_Portable.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenROM_Windows_Installer
          path: OpenROM-v${{ github.event.inputs.version }}-Setup.exe

  # ── Linux — Flutter AppImage + Nuitka CLI ───────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch binaries from OpenROM-bins
        run: |
          git clone --depth 1 https://github.com/M5Devs/OpenROM-bins.git bins
          mkdir -p assets/linux/x86_64
          cp -r bins/linux/x86_64/. assets/linux/x86_64/
          chmod +x assets/linux/x86_64/*

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/microsoft-*.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/github-cli.list
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            libfuse2 wget fuse \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libgdk-pixbuf2.0-dev \
            patchelf ccache

      - name: Set version
        run: echo "${{ github.event.inputs.version }}" > VERSION

      - name: Patch pubspec version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i "s/^version: .*/version: ${VERSION}+1/" gui/pubspec.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      # ── Nuitka standalone — avoids AV false positives from --onefile ──
      - name: Build openrom-core (Nuitka standalone)
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --output-filename=openrom-core \
            --output-dir=dist \
            --include-data-dir=assets=assets \
            core/cli.py
          chmod +x dist/openrom-core.dist/openrom-core

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter dependencies
        working-directory: gui
        run: flutter pub get

      - name: Build Flutter Linux
        working-directory: gui
        run: flutter build linux --release

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool
          chmod +x appimagetool

      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r gui/build/linux/x64/release/bundle/. AppDir/usr/bin/

          # Copy openrom-core standalone folder into AppDir
          cp -r dist/openrom-core.dist/. AppDir/usr/bin/
          chmod +x AppDir/usr/bin/openrom-core

          cp -r themes/ AppDir/usr/bin/themes/
          cp assets/icons/icon.png AppDir/openrom.png
          cp assets/icons/icon.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/openrom.png

          cat > AppDir/OpenROM.desktop << EOF
          [Desktop Entry]
          Name=OpenROM
          Exec=gui
          Icon=openrom
          Type=Application
          Categories=Utility;
          Comment=Universal Retro Gaming Toolkit
          EOF

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/gui" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool AppDir \
            OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.AppImage
          chmod +x OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.AppImage

      - name: Package ZIP
        run: |
          mkdir release
          cp OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.AppImage release/
          # Include openrom-core standalone for headless CLI use
          cp -r dist/openrom-core.dist/. release/
          chmod +x release/openrom-core
          printf 'OpenROM - Linux\n======================================================\nRUN THIS: ./OpenROM-*.AppImage\n\nopenrom-core is the backend engine, do NOT run it directly.\n\nDocs: https://github.com/M5Devs/OpenROM\n' \
            > release/README.txt
          cd release
          zip -r ../OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenROM_Linux
          path: OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.zip

  # ── Linux ARM64 ──────────────────────────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Fetch binaries from OpenROM-bins
        run: |
          git clone --depth 1 https://github.com/M5Devs/OpenROM-bins.git bins
          mkdir -p assets/linux/arm64
          cp -r bins/linux/arm64/. assets/linux/arm64/
          chmod +x assets/linux/arm64/*

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libgdk-pixbuf2.0-dev \
            gcc make git xdelta3 \
            patchelf ccache

      - name: Set version
        run: echo "${{ github.event.inputs.version }}" > VERSION

      - name: Patch pubspec version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i "s/^version: .*/version: ${VERSION}+1/" gui/pubspec.yaml

      - name: Build ecm / unecm from source
        run: |
          git clone https://github.com/kidoz/ecm ecm_src
          echo '#define ECM_VERSION "2.0.0"' > ecm_src/include/version.h
          gcc -O2 -x c -Dnullptr=NULL -Wno-incompatible-pointer-types \
              -o ecm ecm_src/src/ecm.c ecm_src/src/eccedc.c \
              -I ecm_src/include -lm
          gcc -O2 -x c -Dnullptr=NULL -Wno-incompatible-pointer-types \
              -o unecm ecm_src/src/unecm.c ecm_src/src/eccedc.c \
              -I ecm_src/include -lm

      - name: Collect ARM64 binaries
        run: |
          mkdir -p assets/linux/arm64
          cp $(which xdelta3) assets/linux/arm64/xdelta3
          cp ./ecm            assets/linux/arm64/ecm
          cp ./unecm          assets/linux/arm64/unecm
          chmod +x assets/linux/arm64/*

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      # ── Nuitka standalone — avoids AV false positives from --onefile ──
      - name: Build openrom-core (Nuitka standalone)
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --output-filename=openrom-core \
            --output-dir=dist \
            --include-data-dir=assets=assets \
            core/cli.py
          chmod +x dist/openrom-core.dist/openrom-core

      - name: Set up Flutter (manual install for ARM64)
        run: |
          git clone https://github.com/flutter/flutter.git \
            --depth 1 --branch stable \
            $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Flutter precache Linux
        run: flutter precache --linux

      - name: Flutter dependencies
        working-directory: gui
        run: flutter pub get

      - name: Build Flutter Linux ARM64
        working-directory: gui
        run: flutter build linux --release

      - name: Package ZIP
        run: |
          mkdir release
          cp -r gui/build/linux/arm64/release/bundle/. release/
          cp -r dist/openrom-core.dist/. release/
          chmod +x release/openrom-core
          printf 'OpenROM - Linux ARM64\n======================================================\nRUN THIS: ./gui\n\nNOTE: Light tools only on ARM64 (patching, header removal,\nM3U/CUE). Heavy conversions (CHD, CSO, RVZ) need x86_64 build.\n\nDocs: https://github.com/M5Devs/OpenROM\n' \
            > release/README.txt
          cd release
          zip -r ../OpenROM-v${{ github.event.inputs.version }}_Linux_arm64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenROM_Linux_arm64
          path: OpenROM-v${{ github.event.inputs.version }}_Linux_arm64.zip

  # ── macOS ────────────────────────────────────────────────────────────────────
  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch binaries from OpenROM-bins
        run: |
          git clone --depth 1 https://github.com/M5Devs/OpenROM-bins.git bins
          mkdir -p assets/macos/arm64 assets/macos/x86_64
          cp -r bins/macos/arm64/.  assets/macos/arm64/
          cp -r bins/macos/x86_64/. assets/macos/x86_64/
          chmod +x assets/macos/arm64/* assets/macos/x86_64/*

      - name: Set version
        run: echo "${{ github.event.inputs.version }}" > VERSION

      - name: Patch pubspec version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i "" "s/^version: .*/version: ${VERSION}+1/" gui/pubspec.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      # ── Nuitka standalone — avoids AV false positives from --onefile ──
      - name: Build openrom-core (Nuitka standalone)
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --output-filename=openrom-core \
            --output-dir=dist \
            --include-data-dir=assets=assets \
            --macos-target-arch=${{ matrix.arch }} \
            core/cli.py
          chmod +x dist/openrom-core.dist/openrom-core

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter dependencies
        working-directory: gui
        run: flutter pub get

      - name: Build Flutter macOS
        working-directory: gui
        run: flutter build macos --release

      - name: Embed openrom-core in .app bundle
        run: |
          APP_MACOS="gui/build/macos/Build/Products/Release/gui.app/Contents/MacOS"
          # Copy standalone folder contents into the bundle
          cp -r dist/openrom-core.dist/. "$APP_MACOS/"
          chmod +x "$APP_MACOS/openrom-core"
          cp -r themes/ "$APP_MACOS/themes/"

      - name: Sign app bundle (ad-hoc)
        run: |
          APP="gui/build/macos/Build/Products/Release/gui.app"
          xattr -cr "$APP"
          codesign --deep --force \
            --entitlements macos_entitlements.plist \
            --sign - \
            "$APP"

      - name: Create DMG
        run: |
          mkdir -p dmg_contents
          cp -r "gui/build/macos/Build/Products/Release/gui.app" \
                dmg_contents/OpenROM.app
          hdiutil create \
            -volname "OpenROM" \
            -srcfolder dmg_contents \
            -ov \
            -format UDZO \
            OpenROM-v${{ github.event.inputs.version }}_macOS_${{ matrix.arch }}.dmg

      - name: Package ZIP
        run: |
          mkdir release
          cp OpenROM-v${{ github.event.inputs.version }}_macOS_${{ matrix.arch }}.dmg release/
          printf 'OpenROM - macOS\n======================================================\nRUN THIS: Open the .dmg and drag OpenROM to Applications.\n\nDocs: https://github.com/M5Devs/OpenROM\n' \
            > release/README.txt
          cd release
          zip -r ../OpenROM-v${{ github.event.inputs.version }}_macOS_${{ matrix.arch }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenROM_macOS_${{ matrix.arch }}
          path: OpenROM-v${{ github.event.inputs.version }}_macOS_${{ matrix.arch }}.zip

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: OpenROM v${{ github.event.inputs.version }}
          body: |
            ## OpenROM v${{ github.event.inputs.version }}

            Universal Retro Gaming Toolkit for retro gaming.

            Each download includes:
            - **OpenROM** — Flutter desktop GUI
            - **openrom-core** — headless CLI (used internally by the GUI)

            ### CLI usage
            ```
            openrom-core --detect game.iso
            openrom-core --input game.iso --format CHD
            openrom-core --folder /roms/ --format CHD --compression Max
            openrom-core --list-formats
            ```

            ### Supported Formats
            - PS1/Dreamcast/Saturn/Sega CD: BIN/CUE → CHD (createcd)
            - PS2/GameCube/Wii/Xbox: ISO → CHD (createdvd), CSO, RVZ, XISO
            - PSP: ISO → CSO
            - Universal: ZIP/7Z compression, IPS/BPS/xdelta3/DCP patching

            ### Downloads
            | Platform | File |
            |----------|------|
            | 🪟 Windows (Portable) | `OpenROM-v${{ github.event.inputs.version }}_Windows_Portable.zip` |
            | 🪟 Windows (Installer) | `OpenROM-v${{ github.event.inputs.version }}-Setup.exe` |
            | 🐧 Linux | `OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.zip` |
            | 🐧 Linux ARM64 | `OpenROM-v${{ github.event.inputs.version }}_Linux_arm64.zip` |
            | 🍎 macOS Apple Silicon | `OpenROM-v${{ github.event.inputs.version }}_macOS_arm64.zip` |
            | 🍎 macOS Intel | `OpenROM-v${{ github.event.inputs.version }}_macOS_x86_64.zip` |

          files: |
            artifacts/OpenROM_Windows/OpenROM-v${{ github.event.inputs.version }}_Windows_Portable.zip
            artifacts/OpenROM_Windows_Installer/OpenROM-v${{ github.event.inputs.version }}-Setup.exe
            artifacts/OpenROM_Linux/OpenROM-v${{ github.event.inputs.version }}_Linux_x86_64.zip
            artifacts/OpenROM_Linux_arm64/OpenROM-v${{ github.event.inputs.version }}_Linux_arm64.zip
            artifacts/OpenROM_macOS_arm64/OpenROM-v${{ github.event.inputs.version }}_macOS_arm64.zip
            artifacts/OpenROM_macOS_x86_64/OpenROM-v${{ github.event.inputs.version }}_macOS_x86_64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
