name: Update Winget Manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.8.0)'
        required: true

jobs:
  update-winget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}".TrimStart("v")
          } else {
            $version = "${{ github.event.inputs.version }}"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Get installer SHA256
        id: sha
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $url = "https://github.com/M5Devs/OpenROM/releases/download/v$version/OpenROM-v${version}-Setup.exe"
          $tmpFile = "$env:TEMP\openrom-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $tmpFile
          $hash = (Get-FileHash $tmpFile -Algorithm SHA256).Hash.ToLower()
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT
          echo "URL=$url" >> $env:GITHUB_OUTPUT
          Remove-Item $tmpFile

      - name: Update manifest file
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $sha = "${{ steps.sha.outputs.SHA256 }}"
          $url = "${{ steps.sha.outputs.URL }}"

          $manifest = Get-Content winget/M5Devs.OpenROM.yaml -Raw

          # Update version
          $manifest = $manifest -replace 'PackageVersion: .*', "PackageVersion: $version"

          # Update installer URL
          $manifest = $manifest -replace 'InstallerUrl: .*', "InstallerUrl: $url"

          # Update SHA256
          $manifest = $manifest -replace 'InstallerSha256: .*', "InstallerSha256: $sha"

          Set-Content winget/M5Devs.OpenROM.yaml $manifest
          Write-Host "Updated manifest to v$version"

      - name: Install wingetcreate
        run: |
          $url = "https://aka.ms/wingetcreate/latest"
          Invoke-WebRequest -Uri $url -OutFile wingetcreate.exe

      - name: Submit to winget-pkgs
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          .\wingetcreate.exe submit `
            --token ${{ secrets.WINGET_TOKEN }} `
            winget/M5Devs.OpenROM.yaml
        continue-on-error: true

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add winget/M5Devs.OpenROM.yaml
          git commit -m "chore: update winget manifest to v${{ steps.version.outputs.VERSION }}" || echo "No changes"
          git push || echo "Nothing to push"
