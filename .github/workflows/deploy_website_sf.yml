name: Deploy Website to SourceForge

on:
  release:
    types: [published] # يشتغل تلقائي مع أي Release جديد
  workflow_dispatch:   # أو زرار يدوي تقدر تدوس عليه في أي وقت

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenROM
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Generate Website HTML
        run: python scripts/update_website.py

      - name: Setup SSH Key for SourceForge
        env:
          SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # كتابة المفتاح مع الحفاظ التام على الأسطر ونهاية الملف
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # فحص أمان سريع عشان نتأكد إن المفتاح متخزن صح
          echo "🔍 Checking SSH Key file:"
          echo "Total lines: $(wc -l < ~/.ssh/id_ed25519)"
          echo "Header is: $(head -n 1 ~/.ssh/id_ed25519)"
          echo "Footer is: $(tail -n 1 ~/.ssh/id_ed25519)"
          
          # تسجيل سيرفر سورس فورج في الأجهزة الموثوقة
          ssh-keyscan -H web.sourceforge.net >> ~/.ssh/known_hosts

      - name: Deploy to SourceForge via SFTP
        run: |
          sftp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no m5dev@web.sourceforge.net <<EOF
          cd /home/project-web/openrom/htdocs
          put index.html
          bye
          EOF
          echo "🎉 Website deployed successfully to https://openrom.sourceforge.io/"
