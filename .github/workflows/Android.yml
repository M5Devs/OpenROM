name: Android APK Build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (Universal)
    # Disabled for the v3.9.5 release: only build when dispatched manually, or
    # when the repository variable ENABLE_ANDROID_RELEASE is set to 'true'.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_ANDROID_RELEASE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch binaries from SourceForge
        run: |
          bash scripts/fetch-binaries.sh --os android --dest assets/android

      - name: Prepare jniLibs
        run: |
          for abi in arm64-v8a x86_64; do
            mkdir -p "gui/android/app/src/main/jniLibs/$abi"
            if [ -d "assets/android/$abi" ]; then
              for f in "assets/android/$abi"/*; do
                if [ -f "$f" ]; then
                  b=$(basename "$f")
                  cp "$f" "gui/android/app/src/main/jniLibs/$abi/lib${b}.so"
                fi
              done
              chmod +x gui/android/app/src/main/jniLibs/$abi/* 2>/dev/null || true
            fi
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          cd gui
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenROM-Android-Universal
          path: gui/build/app/outputs/flutter-apk/app-release.apk
