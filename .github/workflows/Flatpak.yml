name: Build Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 2.3.0)'
        required: true
        default: '2.3.0'

permissions:
  contents: write

jobs:

  # ── Job 1: Build Flutter + Nuitka outside the Flatpak container ─────────────
  build-app:
    name: Build App (Flutter + Nuitka)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenROM
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/microsoft-*.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/github-cli.list
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libgdk-pixbuf2.0-dev \
            patchelf ccache

      - name: Set version
        run: echo "${{ github.event.inputs.version }}" > VERSION

      - name: Patch pubspec version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i "s/^version: .*/version: ${VERSION}+1/" openrom_flutter/pubspec.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Build openrom-core (Nuitka)
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-filename=openrom-core \
            --include-data-dir=assets=assets \
            core/cli.py
          chmod +x openrom-core

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter dependencies
        working-directory: openrom_flutter
        run: flutter pub get

      - name: Build Flutter Linux
        working-directory: openrom_flutter
        run: flutter build linux --release

      - name: Prepare flatpak-build folder
        run: |
          mkdir -p flatpak-build/bundle
          cp -r openrom_flutter/build/linux/x64/release/bundle/. flatpak-build/bundle/
          cp openrom-core flatpak-build/openrom-core
          chmod +x flatpak-build/openrom-core

      - name: Upload flatpak-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-build
          path: flatpak-build/
          retention-days: 1

  # ── Job 2: Build Flatpak inside privileged container ────────────────────────
  package-flatpak:
    name: Package Flatpak
    needs: build-app
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    steps:
      - name: Checkout OpenROM
        uses: actions/checkout@v7

      - name: Download flatpak-build artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-build
          path: flatpak-build/

      - name: Fix permissions on binaries
        run: chmod +x flatpak-build/openrom-core flatpak-build/bundle/openrom_flutter

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: OpenROM-v${{ github.event.inputs.version }}.flatpak
          manifest-path: flatpak/io.github.M5Devs.OpenROM.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: OpenROM-v${{ github.event.inputs.version }}.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
