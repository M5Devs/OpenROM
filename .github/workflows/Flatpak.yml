name: Build Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 3.5.0)'
        required: true
        default: '3.5.0'

permissions:
  contents: write

jobs:

  # ── Job 1: Build Flutter + Dart on standard runner ────────────────────────
  build-app:
    name: Build App (Flutter + Dart)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenROM
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/microsoft-*.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/github-cli.list
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libgdk-pixbuf2.0-dev \
            patchelf ccache

      - name: Set version
        run: echo "${{ github.event.inputs.version }}" > VERSION

      - name: Patch pubspec version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i "s/^version: .*/version: ${VERSION}+1/" gui/pubspec.yaml

      # ── Build openrom-core ──
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build openrom-core (Dart)
        run: |
          cd core
          dart pub get
          mkdir -p ../flatpak-build
          dart compile exe bin/openrom.dart -o ../flatpak-build/openrom-core
          chmod +x ../flatpak-build/openrom-core

      # ── Build Flutter ──
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter dependencies
        working-directory: gui
        run: flutter pub get

      - name: Build Flutter Linux
        working-directory: gui
        run: flutter build linux --release

      # ── Prepare flatpak-build folder ──
      - name: Prepare flatpak-build
        run: |
          mkdir -p flatpak-build/bundle
          cp -r gui/build/linux/x64/release/bundle/. flatpak-build/bundle/
          chmod +x flatpak-build/bundle/gui
          echo "=== flatpak-build contents ==="
          ls -la flatpak-build/
          echo "=== flatpak-build/bundle contents ==="
          ls -la flatpak-build/bundle/

      # ── Push to temp branch ──
      - name: Push flatpak-build to temp branch
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub CI"
          git checkout -b flatpak-tmp-${{ github.run_id }}
          # Force add even if in .gitignore
          git add -f flatpak-build/
          echo "=== git status ==="
          git status
          echo "=== staged files ==="
          git diff --cached --name-only
          git commit -m "ci: temp flatpak build artifacts [skip ci]"
          git push origin flatpak-tmp-${{ github.run_id }}

  # ── Job 2: Build Flatpak inside privileged container ────────────────────────
  package-flatpak:
    name: Package Flatpak
    needs: build-app
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    steps:
      - name: Checkout temp branch (with flatpak-build/)
        uses: actions/checkout@v4
        with:
          ref: flatpak-tmp-${{ github.run_id }}

      - name: Verify flatpak-build contents
        run: |
          echo "=== flatpak-build/ ==="
          ls -la flatpak-build/
          echo "=== flatpak-build/bundle/ ==="
          ls -la flatpak-build/bundle/

      - name: Fix binary permissions
        run: |
          chmod +x flatpak-build/openrom-core
          chmod +x flatpak-build/bundle/gui

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: OpenROM-v${{ github.event.inputs.version }}.flatpak
          manifest-path: flatpak/io.github.M5Devs.OpenROM.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: OpenROM-v${{ github.event.inputs.version }}.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: Cleanup temp branch ───────────────────────────────────────────────
  cleanup:
    name: Cleanup Temp Branch
    needs: [build-app, package-flatpak]
    runs-on: ubuntu-22.04
    if: always()

    steps:
      - name: Checkout OpenROM
        uses: actions/checkout@v4

      - name: Delete temp branch
        run: |
          git push origin --delete flatpak-tmp-${{ github.run_id }} || true
