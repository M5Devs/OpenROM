name: Build Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 3.5.0)'
        required: true
        default: '3.5.0'

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenROM
        uses: actions/checkout@v4

      - name: Set version
        run: echo "${{ github.event.inputs.version }}" > VERSION

      - name: Patch pubspec version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i "s/^version: .*/version: ${VERSION}+1/" gui/pubspec.yaml

      # 1. طبخ متطلبات لينكس عشان فلاتر يعرف يبني
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev flatpak flatpak-builder elfutils
      # إضافة ريبو Flathub للسيستم
       flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      # 2. تجهيز Dart و Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. بيلد الـ CLI (openrom-core)
      - name: Build Dart Core CLI
        run: |
          mkdir -p flatpak-build
          cd core
          dart pub get
          dart compile exe bin/openrom.dart -o ../flatpak-build/openrom-core
          cd ..

      # 4. بيلد واجهة Flutter للينكس
      - name: Build Flutter Linux Bundle
        run: |
          cd gui
          flutter pub get
          flutter build linux --release
          cd ..

      # 5. نقل ملفات الـ Bundle للمسار اللي فلاتباك مستنيه!
      - name: Prepare Flatpak Bundle Directory
        run: |
          mkdir -p flatpak-build/bundle
          cp -r gui/build/linux/x64/release/bundle/* flatpak-build/bundle/

      # 6. دلوقتي بقى الفلاتباك يدخل يلاقي حاجته جاهزة!
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: OpenROM-v${{ github.event.inputs.version }}.flatpak
          manifest-path: flatpak/io.github.M5Devs.OpenROM.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: OpenROM-v${{ github.event.inputs.version }}.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
