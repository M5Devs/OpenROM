name: Build Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 2.3.0)'
        required: true
        default: '2.3.0'

permissions:
  contents: write

jobs:
  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Python deps sources
        run: |
          curl -sL https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/pip/flatpak-pip-generator \
            -o /tmp/flatpak-pip-generator
          chmod +x /tmp/flatpak-pip-generator
          pip install requirements-parser aiohttp
          python3 /tmp/flatpak-pip-generator \
            customtkinter \
            darkdetect \
            Pillow \
            packaging \
            psutil \
            send2trash \
            tkinterdnd2 \
            --output flatpak/python-deps

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: OpenROM-v${{ github.event.inputs.version }}.flatpak
          manifest-path: flatpak/io.github.M5Devs.OpenROM.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: OpenROM v${{ github.event.inputs.version }}
          files: OpenROM-v${{ github.event.inputs.version }}.flatpak
          body: |
            ### Linux Flatpak
            ```bash
            flatpak install OpenROM-v${{ github.event.inputs.version }}.flatpak
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
