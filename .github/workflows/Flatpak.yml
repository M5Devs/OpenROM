name: Build Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 2.3.0)'
        required: true
        default: '2.3.0'

permissions:
  contents: write

jobs:
  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    steps:
      - name: Checkout OpenROM
        uses: actions/checkout@v7

      # ── Install build tools inside the container ──
      - name: Install build dependencies
        run: |
          dnf update -y -q
          dnf install -y \
            clang cmake ninja-build pkg-config \
            gtk3-devel xz-devel libstdc++-devel \
            glib2-devel gdk-pixbuf2-devel \
            patchelf ccache python3 python3-pip \
            curl git unzip xz-utils zip

      - name: Set version
        run: echo "${{ github.event.inputs.version }}" > VERSION

      - name: Patch pubspec version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i "s/^version: .*/version: ${VERSION}+1/" openrom_flutter/pubspec.yaml

      # ── Build openrom-core ──
      - name: Install Python dependencies
        run: |
          pip3 install --break-system-packages -r requirements.txt
          pip3 install --break-system-packages nuitka ordered-set zstandard

      - name: Build openrom-core (Nuitka)
        run: |
          python3 -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-filename=openrom-core \
            --include-data-dir=assets=assets \
            core/cli.py
          chmod +x openrom-core

      # ── Install Flutter inside the container ──
      - name: Set up Flutter
        run: |
          git clone https://github.com/flutter/flutter.git \
            --depth 1 --branch stable \
            /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          /opt/flutter/bin/flutter precache --linux

      - name: Flutter dependencies
        working-directory: openrom_flutter
        run: /opt/flutter/bin/flutter pub get

      - name: Build Flutter Linux
        working-directory: openrom_flutter
        run: /opt/flutter/bin/flutter build linux --release

      # ── Prepare flatpak-build folder ──
      - name: Prepare flatpak-build
        run: |
          mkdir -p flatpak-build/bundle
          cp -r openrom_flutter/build/linux/x64/release/bundle/. flatpak-build/bundle/
          cp openrom-core flatpak-build/openrom-core
          chmod +x flatpak-build/openrom-core flatpak-build/bundle/openrom_flutter

      # ── Build Flatpak bundle ──
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: OpenROM-v${{ github.event.inputs.version }}.flatpak
          manifest-path: flatpak/io.github.M5Devs.OpenROM.yml
          cache-key: flatpak-builder-${{ github.sha }}

      # ── Upload to GitHub Release ──
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: OpenROM-v${{ github.event.inputs.version }}.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
